<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Numbered GIFs</title>
  <style>
    body{margin:24px;background:#fff7fa;color:#35202a;font:15px system-ui,sans-serif}
    h1{color:#a22d5e}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
    figure{margin:0;padding:12px;background:#fff;border:1px solid #e8cbd7;border-radius:12px;box-shadow:0 2px 6px #0001}
    .number{margin-bottom:8px;color:#a22d5e;font-weight:700}
    img{display:block;width:100%;height:210px;object-fit:contain;background:#fff;border-radius:8px}
    figcaption{margin-top:8px;font-size:12px;overflow-wrap:anywhere}
    @media(max-width:480px){body{margin:14px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}img{height:150px}}
  </style>
</head>
<body>
  <h1>Numbered GIFs</h1>
  <p>Use these numbers to choose a GIF. The top-level files are named 1.gif through 6.gif; the capoo folder is unchanged.</p>
  <main class="gallery">
    <figure><div class="number">#1</div><img src="1.gif" alt="GIF 1"><figcaption>1.gif</figcaption></figure>
    <figure><div class="number">#2</div><img src="2.gif" alt="GIF 2"><figcaption>2.gif</figcaption></figure>
    <figure><div class="number">#3</div><img src="3.gif" alt="GIF 3"><figcaption>3.gif</figcaption></figure>
    <figure><div class="number">#4</div><img src="4.gif" alt="GIF 4"><figcaption>4.gif</figcaption></figure>
    <figure><div class="number">#5</div><img src="5.gif" alt="GIF 5"><figcaption>5.gif</figcaption></figure>
    <figure><div class="number">#6</div><img src="6.gif" alt="GIF 6"><figcaption>6.gif</figcaption></figure>
  </main>
</body>
</html>
